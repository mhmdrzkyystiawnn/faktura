name: Process Reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  process-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call process-reminders endpoint
        run: |
          curl -s -X POST \
            "${{ secrets.API_BASE_URL }}/api/v1/internal/process-reminders" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Cron-Secret: ${{ secrets.INTERNAL_CRON_SECRET }}" \
            -w "\nHTTP_STATUS: %{http_code}\n"
